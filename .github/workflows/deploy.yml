name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Login no Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build e Push da imagem
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-resume-optimizer:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/ai-resume-optimizer:latest

    - name: Deploy na VPS via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/ai-resume-optimizer:latest
            docker stop ai-resume-optimizer || true
            docker rm ai-resume-optimizer || true
            docker run -d --name ai-resume-optimizer -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} -e OPENAI_MODEL=${{ secrets.OPENAI_MODEL }} -p 8501:8501 ${{ secrets.DOCKER_USERNAME }}/ai-resume-optimizer:latest

